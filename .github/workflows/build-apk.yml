name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons and splash images
        run: |
          pip install pillow
          python3 tools/generate-icons.py

      - name: Build static web export
        run: |
          mkdir -p /tmp/stash
          mv src/proxy.ts /tmp/stash/proxy.ts
          mv src/app/auth/confirm/route.ts /tmp/stash/route.ts
          CAMPUSOS_MOBILE=1 npm run build

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --console=plain --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-os-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
